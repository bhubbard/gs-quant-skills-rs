[workspace]
resolver = "2"
members = [
    "crates/gs-quant-core",
    "crates/gs-quant-skills",
    "crates/gs-quant-cli",
]
default-members = [
    "crates/gs-quant-core",
    "crates/gs-quant-skills",
    "crates/gs-quant-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
repository = "https://github.com/bhubbard/gs-quant-skills-rs"

[workspace.dependencies]
gs-quant-core = { path = "crates/gs-quant-core" }
gs-quant-skills = { path = "crates/gs-quant-skills" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
